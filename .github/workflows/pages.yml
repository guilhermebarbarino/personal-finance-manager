name: CI/CD - Finance Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Build and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_security_tests
          POSTGRES_USER: finance_tests
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance_tests -d finance_security_tests"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore backend/src/Finance.Api/Finance.Api.csproj
          dotnet restore backend/tests/Finance.Tests/Finance.Tests.csproj
          dotnet restore backend/tests/Finance.Api.Tests/Finance.Api.Tests.csproj
      - name: Build
        run: dotnet build backend/src/Finance.Api/Finance.Api.csproj --no-restore --configuration Release --warnaserror
      - name: Run xUnit tests and collect coverage
        run: dotnet test backend/tests/Finance.Tests/Finance.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=backend-tests.trx" --collect:"XPlat Code Coverage"
      - name: Test email verification against PostgreSQL
        env:
          FINANCE_TEST_DATABASE: Host=localhost;Port=5432;Database=finance_security_tests;Username=finance_tests;Password=ci-only-test-password
        run: dotnet test backend/tests/Finance.Api.Tests/Finance.Api.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=email-verification.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/tests/Finance.Tests/TestResults/**
            backend/tests/Finance.Api.Tests/TestResults/**
          if-no-files-found: ignore

  frontend:
    name: Frontend - TypeScript and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check and production build
        working-directory: frontend
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - name: Upload verified frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy - GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check API URL configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https:// ]]; then
            echo "::error::Configure repository Actions variable VITE_API_URL with an HTTPS API origin."
            exit 1
          fi
      - name: Download verified frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

